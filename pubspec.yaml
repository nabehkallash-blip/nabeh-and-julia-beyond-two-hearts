name: nabeh_and_julia
description: A romantic adventure game about two hearts finding their way to each other.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/together.jpg"
  adaptive_icon_background: "#171329"
  adaptive_icon_foreground: "assets/images/together.jpg"
  min_sdk_android: 21
